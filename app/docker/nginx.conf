server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    # Liveness for Nginx itself, never touches PHP
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # FPM ping/status, only from inside the pod
    location ~ ^/(fpm-ping|fpm-status)$ {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        # Same path exists in the FPM container, where the code lives
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
