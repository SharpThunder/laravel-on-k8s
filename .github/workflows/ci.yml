name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: make lint
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for app in api web; do
            helm template "$app" charts/laravel-app -f "values/$app.yaml" | ./kubeconform -strict -summary
          done
          ./kubeconform -strict -summary deploy/dev/

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Build images
        run: |
          docker build --target fpm -t laravel-on-k8s-fpm:local app
          docker build --target web -t laravel-on-k8s-web:local app
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load images into kind
        run: kind load docker-image laravel-on-k8s-fpm:local laravel-on-k8s-web:local --name ci
      - name: Deploy (migrations run as a pre-install hook)
        run: ./scripts/deploy.sh
        env:
          HELM_ARGS: --set ingress.enabled=false
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Zero-downtime rollout (requests keep flowing while pods are replaced)
        run: ./scripts/zero-downtime.sh
        env:
          HELM_ARGS: --set ingress.enabled=false
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n laravel get pods,jobs,pvc -o wide
          kubectl -n laravel describe pods | tail -n 80
          kubectl -n laravel logs -l app.kubernetes.io/component=migrate --tail=50 || true
          kubectl -n laravel logs -l app.kubernetes.io/component=http --all-containers --tail=50 || true
