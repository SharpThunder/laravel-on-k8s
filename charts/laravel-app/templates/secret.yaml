{{- if not .Values.existingSecret }}
# Created as a hook so it exists before the pre-install migration Job runs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "laravel-app.secretName" . }}
  labels: {{- include "laravel-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
{{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
