apiVersion: v1
kind: Service
metadata:
  name: {{ include "laravel-app.fullname" . }}
  labels: {{- include "laravel-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "laravel-app.selector" . | nindent 4 }}
    app.kubernetes.io/component: http
  ports:
    - name: http
      port: 80
      targetPort: http
